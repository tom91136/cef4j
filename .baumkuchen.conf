# The baumkuchen configuration of this build.
#
# The compiler plugin checks, the analysis rules and the scalafix rules that this build leaves out are named here, by
# id. Every other check runs: a new violation of one of them fails the build on a CI server, and is reported without
# failing it on a workstation.
#
# The ids of the checks, the rules and the bans are the ones the tools know, and a name no tool knows fails the build
# as the configuration is read, so a typo here is caught before anything runs.
#
# No check, rule or ban is disabled: the build satisfies all of them.
disabled = []

# The findings of the analysis that the build already has are recorded in the baseline, so that they are reported
# without failing the build, and only a new one fails it.
baseline = "baumkuchen-baseline.tsv"

# The methods the analysis records as pure, which fail it once they are not.
purity = "baumkuchen-purity.tsv"

# The code generator is published and its API is used by the build, so the analysis counts it as used.
projects.cef4j-codegen {
  library = true
}

# The modules whose API other builds call, so the analysis counts their public code as used.
projects.cef4j-api {
  library = true
}
projects.cef4j-cdp {
  library = true
}
projects.cef4j-http {
  library = true
}
projects.cef4j-remote {
  library = true
}
projects.cef4j-remote-frame {
  library = true
}
projects.cef4j-runtime-packager {
  library = true
}
projects.cef4j-test-shared {
  library = true
}
projects.cef4j-test-support {
  library = true
}
projects.cef4j-webdriver {
  library = true
}
projects.cef4j-inprocess-swing {
  library = true
}
projects.cef4j-inprocess-webdriver {
  library = true
}
projects.cef4j-codecs-gson {
  library = true
}
projects.cef4j-codecs-jackson {
  library = true
}

# The code the generator writes is not the code of the build, so the rules do not read it.
generated = [
  "**/net/kurobako/cef4j/gen/**"
  "**/net/kurobako/cef4j/cdp/generated/**"
  "**/net/kurobako/cef4j/ipc/protocol/gen/**"
]

# The rules over the text of the files the build holds, whatever their language, which the analysis reads from the
# files git sees. They are the part of baumkuchen that reaches the Java and the native code.
text {
  # A binary file in the repository is a mistake; the archives the build needs are downloaded, not committed.
  binary = {
    message = "is a binary file; commit the text that produces it, not the file"
  }

  patterns = [
    {
      pattern = "\\bprintStackTrace\\s*\\("
      message = "printStackTrace loses the context of the failure; log it with the logger of the module"
    }
    {
      pattern = "\\.equals\\([^()]*\\)\\s*=="
      message = "comparing a boolean with == compares references; use equals"
    }
  ]
}
