name: Stream runner telemetry
description: Stream lightweight runner health snapshots to an OCI collector

inputs:
  enabled:
    description: Enable outbound telemetry for this job
    required: false
    default: 'false'
  mode:
    description: Start or stop the telemetry sidecar
    required: true
  host:
    description: OCI SSH host
    required: false
    default: ''
  user:
    description: OCI SSH user
    required: false
    default: 'tom'
  port:
    description: OCI SSH port
    required: false
    default: '22'
  ssh-key:
    description: Private key used for the OCI SSH connection
    required: false
    default: ''
  known-hosts:
    description: Pinned OCI SSH host keys
    required: false
    default: ''
  remote-root:
    description: Root directory for collected telemetry
    required: false
    default: '/home/tom/gha-telemetry'
  context:
    description: Human-readable job and matrix context
    required: false
    default: 'job'
  interval:
    description: Seconds between health snapshots
    required: false
    default: '30'

runs:
  using: composite
  steps:
    - name: Start runner telemetry
      if: inputs.mode == 'start'
      shell: bash
      env:
        CI_TELEMETRY_ENABLED: ${{ inputs.enabled }}
        CI_TELEMETRY_HOST: ${{ inputs.host }}
        CI_TELEMETRY_USER: ${{ inputs.user }}
        CI_TELEMETRY_PORT: ${{ inputs.port }}
        CI_TELEMETRY_SSH_KEY: ${{ inputs.ssh-key }}
        CI_TELEMETRY_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        CI_TELEMETRY_REMOTE_ROOT: ${{ inputs.remote-root }}
        CI_TELEMETRY_CONTEXT: ${{ inputs.context }}
        CI_TELEMETRY_INTERVAL: ${{ inputs.interval }}
      run: bash .github/actions/runner-telemetry/runner-telemetry.sh start

    - name: Stop runner telemetry
      if: inputs.mode == 'stop'
      shell: bash
      env:
        CI_TELEMETRY_ENABLED: ${{ inputs.enabled }}
        CI_TELEMETRY_HOST: ${{ inputs.host }}
        CI_TELEMETRY_USER: ${{ inputs.user }}
        CI_TELEMETRY_PORT: ${{ inputs.port }}
        CI_TELEMETRY_SSH_KEY: ${{ inputs.ssh-key }}
        CI_TELEMETRY_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        CI_TELEMETRY_REMOTE_ROOT: ${{ inputs.remote-root }}
        CI_TELEMETRY_CONTEXT: ${{ inputs.context }}
        CI_TELEMETRY_INTERVAL: ${{ inputs.interval }}
      run: bash .github/actions/runner-telemetry/runner-telemetry.sh stop
