name: Prepare CEF archives
description: Restore and validate the target and cross-platform code-generation archives

inputs:
  version:
    description: CEF binary version
    required: true
  platform:
    description: Target CEF platform
    required: true
  save-cache:
    description: Save archives missing from the cache
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - id: target-cache
      name: Restore target CEF archive
      uses: actions/cache/restore@v6
      with:
        path: |
          .cef-dist/cef_binary_${{ inputs.version }}_${{ inputs.platform }}_minimal.tar.bz2
          .cef-dist/cef_binary_${{ inputs.version }}_${{ inputs.platform }}_minimal.tar.bz2.sha1
        key: cef-archive-v2-${{ inputs.platform }}-${{ inputs.version }}
        restore-keys: cef-archive-${{ inputs.platform }}-${{ inputs.version }}
        enableCrossOsArchive: true

    # The generator normalises API metadata across all three desktop CEF
    # distributions, regardless of the current build platform.
    - id: linux-codegen-cache
      name: Restore Linux code-generation archive
      if: inputs.platform != 'linux64'
      uses: actions/cache/restore@v6
      with:
        path: |
          .cef-dist/cef_binary_${{ inputs.version }}_linux64_minimal.tar.bz2
          .cef-dist/cef_binary_${{ inputs.version }}_linux64_minimal.tar.bz2.sha1
        key: cef-archive-v2-linux64-${{ inputs.version }}
        restore-keys: cef-archive-linux64-${{ inputs.version }}
        enableCrossOsArchive: true

    - id: macos-codegen-cache
      name: Restore macOS code-generation archive
      if: inputs.platform != 'macosx64'
      uses: actions/cache/restore@v6
      with:
        path: |
          .cef-dist/cef_binary_${{ inputs.version }}_macosx64_minimal.tar.bz2
          .cef-dist/cef_binary_${{ inputs.version }}_macosx64_minimal.tar.bz2.sha1
        key: cef-archive-v2-macosx64-${{ inputs.version }}
        restore-keys: cef-archive-macosx64-${{ inputs.version }}
        enableCrossOsArchive: true

    - id: windows-codegen-cache
      name: Restore Windows code-generation archive
      if: inputs.platform != 'windows64'
      uses: actions/cache/restore@v6
      with:
        path: |
          .cef-dist/cef_binary_${{ inputs.version }}_windows64_minimal.tar.bz2
          .cef-dist/cef_binary_${{ inputs.version }}_windows64_minimal.tar.bz2.sha1
        key: cef-archive-v2-windows64-${{ inputs.version }}
        restore-keys: cef-archive-windows64-${{ inputs.version }}
        enableCrossOsArchive: true

    - name: Fetch and validate missing CEF archives
      shell: bash
      env:
        CEF_VERSION: ${{ inputs.version }}
        TARGET_PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        mkdir -p .cef-dist

        fetch() {
          local url=$1 destination=$2 partial="${2}.part"
          rm -f "${partial}"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output "${partial}" "${url}"
          mv "${partial}" "${destination}"
        }

        sha1_file() {
          if command -v sha1sum >/dev/null 2>&1; then
            sha1sum "$1" | awk '{print $1}'
          else
            shasum -a 1 "$1" | awk '{print $1}'
          fi
        }

        for platform in "${TARGET_PLATFORM}" linux64 macosx64 windows64; do
          name="cef_binary_${CEF_VERSION}_${platform}_minimal.tar.bz2"
          archive=".cef-dist/${name}"
          checksum="${archive}.sha1"
          if ! test -f "${archive}" || ! tar -tjf "${archive}" >/dev/null 2>&1; then
            rm -f "${archive}"
            fetch "https://cef-builds.spotifycdn.com/${name}" "${archive}"
            tar -tjf "${archive}" >/dev/null
          fi
          if ! test -f "${checksum}" || ! tr -d '\r\n' < "${checksum}" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            fetch "https://cef-builds.spotifycdn.com/${name}.sha1" "${checksum}"
          fi
          expected=$(tr -d '\r\n' < "${checksum}" | tr '[:upper:]' '[:lower:]')
          actual=$(sha1_file "${archive}")
          test "${actual}" = "${expected}" || {
            echo "CEF archive SHA-1 mismatch: ${archive}" >&2
            exit 1
          }
        done

    - name: Save target CEF archive
      if: steps.target-cache.outputs.cache-hit != 'true' && inputs.save-cache == 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          .cef-dist/cef_binary_${{ inputs.version }}_${{ inputs.platform }}_minimal.tar.bz2
          .cef-dist/cef_binary_${{ inputs.version }}_${{ inputs.platform }}_minimal.tar.bz2.sha1
        key: cef-archive-v2-${{ inputs.platform }}-${{ inputs.version }}
        enableCrossOsArchive: true

    - name: Save Linux code-generation archive
      if: inputs.platform != 'linux64' && steps.linux-codegen-cache.outputs.cache-hit != 'true' && inputs.save-cache == 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          .cef-dist/cef_binary_${{ inputs.version }}_linux64_minimal.tar.bz2
          .cef-dist/cef_binary_${{ inputs.version }}_linux64_minimal.tar.bz2.sha1
        key: cef-archive-v2-linux64-${{ inputs.version }}
        enableCrossOsArchive: true

    - name: Save macOS code-generation archive
      if: inputs.platform != 'macosx64' && steps.macos-codegen-cache.outputs.cache-hit != 'true' && inputs.save-cache == 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          .cef-dist/cef_binary_${{ inputs.version }}_macosx64_minimal.tar.bz2
          .cef-dist/cef_binary_${{ inputs.version }}_macosx64_minimal.tar.bz2.sha1
        key: cef-archive-v2-macosx64-${{ inputs.version }}
        enableCrossOsArchive: true

    - name: Save Windows code-generation archive
      if: inputs.platform != 'windows64' && steps.windows-codegen-cache.outputs.cache-hit != 'true' && inputs.save-cache == 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          .cef-dist/cef_binary_${{ inputs.version }}_windows64_minimal.tar.bz2
          .cef-dist/cef_binary_${{ inputs.version }}_windows64_minimal.tar.bz2.sha1
        key: cef-archive-v2-windows64-${{ inputs.version }}
        enableCrossOsArchive: true
