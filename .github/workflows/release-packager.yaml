name: Release runtime packager

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing runtime-packager-v-prefixed tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-packager-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and upload runtime packager
    if: startsWith(github.event.release.tag_name || inputs.tag, 'runtime-packager-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: central
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '11'
          cache: maven
          cache-dependency-path: cef4j-runtime-packager/pom.xml
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Match tag to packager version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version=$(./mvnw -q -f cef4j-runtime-packager/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          test "${RELEASE_TAG}" = "runtime-packager-v${version}"
          case "${version}" in
            *-SNAPSHOT) exit 1 ;;
          esac

      - name: Upload signed Central deployment for manual publication
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -f cef4j-runtime-packager/pom.xml clean deploy -Pruntime-packager-release

      - name: Attach executable CLI to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" cef4j-runtime-packager/target/cef4j-runtime-packager-*.jar --clobber
