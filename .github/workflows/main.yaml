name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep this matrix curated rather than multiplying every JDK, CEF, JavaFX, and OS.
# JavaFX rows always override compile and test versions together. Java 11 is the
# runtime/bytecode floor; Maven and Scala code generation intentionally run on 17+.
jobs:
  linux:
    name: Linux ${{ matrix.arch }} / JDK ${{ matrix.java }} / CEF ${{ matrix.cef-api }} / JavaFX ${{ matrix.javafx }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04, cef-platform: linux64, java: '17', cef-api: '146', cef-version: '146.0.9+g3ca6a87+chromium-146.0.7680.165', javafx: '13.0.2', java11-smoke: 'true' }
          - { arch: x86_64, os: ubuntu-24.04, cef-platform: linux64, java: '21', cef-api: '146', cef-version: '146.0.9+g3ca6a87+chromium-146.0.7680.165', javafx: '21.0.7', java11-smoke: 'false' }
          - { arch: x86_64, os: ubuntu-24.04, cef-platform: linux64, java: '25', cef-api: '146', cef-version: '146.0.9+g3ca6a87+chromium-146.0.7680.165', javafx: '25.0.2', java11-smoke: 'false' }
          - { arch: x86_64, os: ubuntu-24.04, cef-platform: linux64, java: '17', cef-api: '144', cef-version: '144.0.19+g937f5c6+chromium-144.0.7559.246', javafx: '17.0.15', java11-smoke: 'false' }
          - { arch: x86_64, os: ubuntu-24.04, cef-platform: linux64, java: '17', cef-api: '116', cef-version: '116.0.27+gd8c85ac+chromium-116.0.5845.190', javafx: '17.0.15', java11-smoke: 'false' }
          - { arch: x86_64, os: ubuntu-24.04, cef-platform: linux64, java: '17', cef-api: '109', cef-version: '109.1.18+gf1c41e4+chromium-109.0.5414.120', javafx: '17.0.15', java11-smoke: 'false' }
          - { arch: aarch64, os: ubuntu-24.04-arm, cef-platform: linuxarm64, java: '21', cef-api: '146', cef-version: '146.0.9+g3ca6a87+chromium-146.0.7680.165', javafx: '21.0.1', java11-smoke: 'true' }
          - { arch: aarch64, os: ubuntu-24.04-arm, cef-platform: linuxarm64, java: '21', cef-api: '144', cef-version: '144.0.19+g937f5c6+chromium-144.0.7559.246', javafx: '21.0.1', java11-smoke: 'false' }
          - { arch: aarch64, os: ubuntu-24.04-arm, cef-platform: linuxarm64, java: '21', cef-api: '116', cef-version: '116.0.27+gd8c85ac+chromium-116.0.5845.190', javafx: '21.0.1', java11-smoke: 'false' }
          - { arch: aarch64, os: ubuntu-24.04-arm, cef-platform: linuxarm64, java: '21', cef-api: '109', cef-version: '109.1.18+gf1c41e4+chromium-109.0.5414.120', javafx: '21.0.1', java11-smoke: 'false' }
    steps:
      - uses: actions/checkout@v6

      # The complete 4-version/6-platform archive set is about 4.9 GiB. Each
      # immutable archive has one cache entry, shared by target and codegen use.
      - name: Prepare compressed CEF archives
        uses: ./.github/actions/cef-archives
        with:
          version: ${{ matrix.cef-version }}
          platform: ${{ matrix.cef-platform }}
          # PR caches remain read-only so they cannot evict main's entries.
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: |
            11
            ${{ matrix.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Cache Maven wrapper distribution
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - id: sysroot-cache
        name: Restore AlmaLinux 8 sysroot
        uses: actions/cache/restore@v5
        with:
          path: sysroot/out/sysroot-al8-${{ matrix.arch }}.tar.xz
          key: sysroot-al8-${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-${{ hashFiles('sysroot/Dockerfile', 'sysroot/manage.sh') }}

      - name: Build AlmaLinux 8 sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        run: sysroot/manage.sh build ${{ matrix.arch }}

      - name: Save AlmaLinux 8 sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: sysroot/out/sysroot-al8-${{ matrix.arch }}.tar.xz
          key: ${{ steps.sysroot-cache.outputs.cache-primary-key }}

      - name: Prepare AlmaLinux 8 sysroot
        run: sysroot/manage.sh prepare ${{ matrix.arch }}

      - name: Install Linux build and runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake make binutils xvfb \
            libgtk-3-0 libxss1 libnss3 libasound2t64 libcups2 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libpango-1.0-0 libatk-bridge2.0-0 libdrm2 libgbm1

      # dependency:go-offline cannot see Spotless' lazily provisioned Eclipse CDT
      # P2 payload. Resolve it separately with retries; the actual build and tests
      # below still execute exactly once.
      - name: Prewarm Spotless C++ formatter
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: >-
            ./mvnw -B -pl cef4j-native spotless:check
            "-Dcef.version=${{ matrix.cef-version }}"
            "-Dcef.api.version=${{ matrix.cef-api }}"

      - name: Build and test against AlmaLinux 8 sysroot
        env:
          CMAKE_SYSROOT: ${{ github.workspace }}/sysroot/out/${{ matrix.arch }}
          CEF_VERSION: ${{ matrix.cef-version }}
          CEF_API: ${{ matrix.cef-api }}
          JAVAFX_VERSION: ${{ matrix.javafx }}
          JAVAFX_TEST_VERSION: ${{ matrix.javafx }}
          JAVA11_SMOKE: ${{ matrix.java11-smoke }}
        run: .github/ci/linux-build.sh

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-linux-${{ matrix.arch }}-jdk${{ matrix.java }}-cef${{ matrix.cef-api }}-jfx${{ matrix.javafx }}
          path: |
            **/target/surefire-reports/**
            **/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: ${{ matrix.label }} / JDK ${{ matrix.java }} / CEF ${{ matrix.cef-api }} / JavaFX ${{ matrix.javafx }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'Windows x64', os: 'windows-latest', arch: x86_64, cef-platform: windows64, distribution: corretto, java: '17', cef-api: '146', cef-version: '146.0.9+g3ca6a87+chromium-146.0.7680.165', javafx: '13.0.2', javafx-tests: 'true', java11-smoke: 'true' }
          - { label: 'Windows x64 current JDK', os: 'windows-latest', arch: x86_64, cef-platform: windows64, distribution: corretto, java: '25', cef-api: '146', cef-version: '146.0.9+g3ca6a87+chromium-146.0.7680.165', javafx: '25.0.2', javafx-tests: 'true', java11-smoke: 'false' }
          - { label: 'Windows x64', os: 'windows-latest', arch: x86_64, cef-platform: windows64, distribution: corretto, java: '17', cef-api: '144', cef-version: '144.0.19+g937f5c6+chromium-144.0.7559.246', javafx: '17.0.15', javafx-tests: 'true', java11-smoke: 'false' }
          - { label: 'Windows x64', os: 'windows-latest', arch: x86_64, cef-platform: windows64, distribution: corretto, java: '17', cef-api: '116', cef-version: '116.0.27+gd8c85ac+chromium-116.0.5845.190', javafx: '17.0.15', javafx-tests: 'true', java11-smoke: 'false' }
          - { label: 'Windows x64', os: 'windows-latest', arch: x86_64, cef-platform: windows64, distribution: corretto, java: '17', cef-api: '109', cef-version: '109.1.18+gf1c41e4+chromium-109.0.5414.120', javafx: '17.0.15', javafx-tests: 'true', java11-smoke: 'false' }
          # The Microsoft ARM64 JDK turns Chromium's NTE_BAD_KEYSET exception into a fatal VM
          # error on hosted Windows ARM. Zulu is a native Windows ARM64 JDK at the same Java level.
          - { label: 'Windows ARM', os: 'windows-11-arm', arch: aarch64, cef-platform: windowsarm64, distribution: zulu, java: '21', cef-api: '146', cef-version: '146.0.9+g3ca6a87+chromium-146.0.7680.165', javafx: '21.0.7', javafx-tests: 'false', java11-smoke: 'true' }
          - { label: 'Windows ARM', os: 'windows-11-arm', arch: aarch64, cef-platform: windowsarm64, distribution: zulu, java: '21', cef-api: '144', cef-version: '144.0.19+g937f5c6+chromium-144.0.7559.246', javafx: '21.0.7', javafx-tests: 'false', java11-smoke: 'false' }
          - { label: 'Windows ARM', os: 'windows-11-arm', arch: aarch64, cef-platform: windowsarm64, distribution: zulu, java: '21', cef-api: '116', cef-version: '116.0.27+gd8c85ac+chromium-116.0.5845.190', javafx: '21.0.7', javafx-tests: 'false', java11-smoke: 'false' }
          - { label: 'Windows ARM', os: 'windows-11-arm', arch: aarch64, cef-platform: windowsarm64, distribution: zulu, java: '21', cef-api: '109', cef-version: '109.1.18+gf1c41e4+chromium-109.0.5414.120', javafx: '21.0.7', javafx-tests: 'false', java11-smoke: 'false' }
          - { label: 'macOS Intel', os: 'macos-15-intel', arch: x86_64, cef-platform: macosx64, distribution: corretto, java: '17', cef-api: '146', cef-version: '146.0.9+g3ca6a87+chromium-146.0.7680.165', javafx: '13.0.2', javafx-tests: 'true', java11-smoke: 'true' }
          - { label: 'macOS Intel', os: 'macos-15-intel', arch: x86_64, cef-platform: macosx64, distribution: corretto, java: '17', cef-api: '144', cef-version: '144.0.19+g937f5c6+chromium-144.0.7559.246', javafx: '17.0.15', javafx-tests: 'true', java11-smoke: 'false' }
          - { label: 'macOS Intel', os: 'macos-15-intel', arch: x86_64, cef-platform: macosx64, distribution: corretto, java: '17', cef-api: '116', cef-version: '116.0.27+gd8c85ac+chromium-116.0.5845.190', javafx: '17.0.15', javafx-tests: 'true', java11-smoke: 'false' }
          - { label: 'macOS Intel', os: 'macos-15-intel', arch: x86_64, cef-platform: macosx64, distribution: corretto, java: '17', cef-api: '109', cef-version: '109.1.18+gf1c41e4+chromium-109.0.5414.120', javafx: '17.0.15', javafx-tests: 'true', java11-smoke: 'false' }
          - { label: 'macOS ARM', os: 'macos-15', arch: aarch64, cef-platform: macosarm64, distribution: corretto, java: '21', cef-api: '146', cef-version: '146.0.9+g3ca6a87+chromium-146.0.7680.165', javafx: '21.0.7', javafx-tests: 'true', java11-smoke: 'false' }
          - { label: 'macOS ARM', os: 'macos-15', arch: aarch64, cef-platform: macosarm64, distribution: corretto, java: '21', cef-api: '144', cef-version: '144.0.19+g937f5c6+chromium-144.0.7559.246', javafx: '21.0.7', javafx-tests: 'true', java11-smoke: 'false' }
          - { label: 'macOS ARM', os: 'macos-15', arch: aarch64, cef-platform: macosarm64, distribution: corretto, java: '21', cef-api: '116', cef-version: '116.0.27+gd8c85ac+chromium-116.0.5845.190', javafx: '21.0.7', javafx-tests: 'true', java11-smoke: 'false' }
          - { label: 'macOS ARM', os: 'macos-15', arch: aarch64, cef-platform: macosarm64, distribution: corretto, java: '21', cef-api: '109', cef-version: '109.1.18+gf1c41e4+chromium-109.0.5414.120', javafx: '21.0.7', javafx-tests: 'true', java11-smoke: 'false' }
    steps:
      - uses: actions/checkout@v6

      # setup-java records each installation in Maven's toolchains.xml. Windows
      # ARM needs Microsoft for the Java 11 smoke toolchain because Zulu's native
      # Windows ARM64 builds start after 11; the active Java 21 build JDK remains
      # Zulu to avoid Microsoft 21's fatal handling of Chromium NTE_BAD_KEYSET.
      - name: Set up Java 11 runtime toolchain
        uses: actions/setup-java@v5
        with:
          distribution: ${{ runner.os == 'Windows' && matrix.arch == 'aarch64' && 'microsoft' || matrix.distribution }}
          java-version: '11'

      - name: Set up build JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Cache Maven wrapper distribution
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Prepare compressed CEF archives
        uses: ./.github/actions/cef-archives
        with:
          version: ${{ matrix.cef-version }}
          platform: ${{ matrix.cef-platform }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Resolve dependencies
        if: runner.os != 'Windows' || matrix.arch != 'aarch64'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: >-
            ./mvnw -B dependency:go-offline
            "-DexcludeArtifactIds=cef4j-platform,cef4j-runtime-server"
            "-Dcef.version=${{ matrix.cef-version }}"
            "-Dcef.api.version=${{ matrix.cef-api }}"
            "-Djavafx.version=${{ matrix.javafx }}"
            "-Djavafx.test.version=${{ matrix.javafx }}"

      - name: Resolve dependencies for Windows ARM
        if: runner.os == 'Windows' && matrix.arch == 'aarch64'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: >-
            ./mvnw -B dependency:go-offline
            "-DexcludeArtifactIds=cef4j-platform,cef4j-runtime-server"
            "-Dcef.version=${{ matrix.cef-version }}"
            "-Dcef.api.version=${{ matrix.cef-api }}"
            "-Djavafx.version=${{ matrix.javafx }}"
            "-Djavafx.test.version=${{ matrix.javafx }}"
            "-Djavafx.platform=win"

      # Spotless provisions Eclipse CDT from its P2 repository only when the C++
      # formatter first runs, so dependency:go-offline does not protect this CDN
      # access. Retrying this read-only format check does not retry any test.
      - name: Prewarm Spotless C++ formatter
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: >-
            ./mvnw -B -pl cef4j-native spotless:check
            "-Dcef.version=${{ matrix.cef-version }}"
            "-Dcef.api.version=${{ matrix.cef-api }}"

      # GitHub-hosted Windows and macOS runners are disposable VMs with their own
      # WindowStation/WindowServer session, so GUI tests cannot reach a developer desktop.
      - name: Build and test in isolated hosted desktop
        if: matrix.javafx-tests == 'true'
        run: >-
          ./mvnw -B clean install
          "-Dcef.version=${{ matrix.cef-version }}"
          "-Dcef.api.version=${{ matrix.cef-api }}"
          "-Djavafx.version=${{ matrix.javafx }}"
          "-Djavafx.test.version=${{ matrix.javafx }}"
          "-Dcef4j.test.extraArgs=--disable-gpu"
          "-Dcef4j.runtime.server.extraArgs=--disable-gpu"

      # OpenJFX currently publishes no Windows ARM64 native artifacts. Compile the
      # complete reactor, then exercise every non-JavaFX module natively on ARM64.
      - name: Build on Windows ARM without JavaFX runtime tests
        if: matrix.javafx-tests == 'false'
        shell: bash
        run: |
          ./mvnw -B clean install -DskipTests \
            "-Dcef.version=${{ matrix.cef-version }}" \
            "-Dcef.api.version=${{ matrix.cef-api }}" \
            "-Djavafx.version=${{ matrix.javafx }}" \
            "-Djavafx.test.version=${{ matrix.javafx }}" \
            "-Djavafx.platform=win" \
            "-Dcef4j.test.extraArgs=--disable-gpu" \
            "-Dcef4j.runtime.server.extraArgs=--disable-gpu"
          ./mvnw -B clean test \
            -pl '!cef4j-inprocess-jfx,!cef4j-remote-jfx,!cef4j-integration-tests,!cef4j-sample' \
            "-Dcef.version=${{ matrix.cef-version }}" \
            "-Dcef.api.version=${{ matrix.cef-api }}" \
            "-Djavafx.version=${{ matrix.javafx }}" \
            "-Djavafx.test.version=${{ matrix.javafx }}" \
            "-Djavafx.platform=win" \
            "-Dcef4j.test.extraArgs=--disable-gpu" \
            "-Dcef4j.runtime.server.extraArgs=--disable-gpu"

      - name: Java 11 runtime smoke
        if: matrix.java11-smoke == 'true'
        run: >-
          ./mvnw -B
          -pl cef4j-remote-core,cef4j-remote-recording-gson,cef4j-remote-recording-jackson,cef4j-remote-frame,cef4j-cdp,cef4j-cdp-gson,cef4j-cdp-jackson,cef4j-remote-cdp-gson,cef4j-remote-cdp-jackson,cef4j-webdriver,cef4j-webdriver-gson,cef4j-webdriver-jackson,cef4j-remote-webdriver
          test "-Djava11.runtime.smoke=true"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os }}-cef${{ matrix.cef-api }}-jdk${{ matrix.java }}-jfx${{ matrix.javafx }}
          path: |
            **/target/surefire-reports/**
            **/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7
