name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven-wrapper:
    name: Bootstrap Maven wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Test CI build environment helpers
        run: bash .github/ci/build-env-test.sh

      - &setup-java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - uses: ./.github/actions/maven-wrapper

  packager:
    name: Runtime packager / ${{ matrix.os }}
    needs: maven-wrapper
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026, macos-26]
    steps:
      - uses: actions/checkout@v7

      - *setup-java

      - uses: ./.github/actions/maven-wrapper

      - name: Test runtime packager
        run: ./mvnw -B -f cef4j-runtime-packager/pom.xml clean verify

      - name: Verify packager release artifacts
        if: matrix.os == 'ubuntu-24.04'
        run: ./mvnw -B -f cef4j-runtime-packager/pom.xml clean verify -Pruntime-packager-release -Dgpg.skip=true

  build:
    needs: maven-wrapper
    name: ${{ matrix.os.label }} / CEF ${{ matrix.cef.api }}
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        os:
          - label: Linux x64
            runner: ubuntu-24.04
            arch: x86_64
            cef-platform: linux64
            distro: corretto
            sysroot: true
            msvc: false

          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            arch: aarch64
            cef-platform: linuxarm64
            distro: corretto
            sysroot: true
            msvc: false

          - label: Windows x64
            runner: windows-2025-vs2026
            arch: x86_64
            cef-platform: windows64
            distro: corretto
            msvc: true

          - label: Windows ARM
            runner: windows-11-arm
            arch: aarch64
            cef-platform: windowsarm64
            distro: zulu
            msvc: true

          - label: macOS Intel
            runner: macos-26-intel
            arch: x86_64
            cef-platform: macosx64
            distro: corretto
            msvc: false

          - label: macOS ARM
            runner: macos-26
            arch: aarch64
            cef-platform: macosarm64
            distro: corretto
            msvc: false

        cef:
          - { version: '109.1.18+gf1c41e4+chromium-109.0.5414.120', api: '109' }
          - { version: '116.0.27+gd8c85ac+chromium-116.0.5845.190', api: '116' }
          - { version: '138.0.62+g6981a09+chromium-138.0.7204.310', api: '138' }
          - { version: '144.0.19+g937f5c6+chromium-144.0.7559.246', api: '144' }
          - { version: '150.0.18+gdb11278+chromium-150.0.7871.213', api: '150' }

    env:
      CEF_VERSION: ${{ matrix.cef.version }}
      CEF_API: ${{ matrix.cef.api }}
      CEF_PLATFORM: ${{ matrix.os.cef-platform }}
      ARCH: ${{ matrix.os.arch }}
      CMAKE_SYSROOT: ${{ github.workspace }}/sysroot/out/${{ matrix.os.arch }}

    steps:
      - uses: actions/checkout@v7

      # XXX Windows ARM uses Microsoft 11 for the smoke toolchain, Zulu for the build JDKs.
      - name: Set up JDK 11 (runtime smoke)
        id: jdk11
        uses: actions/setup-java@v5
        with:
          distribution: ${{ runner.os == 'Windows' && matrix.os.arch == 'aarch64' && 'microsoft' || matrix.os.distro }}
          java-version: '11'

      - name: Set up JDK 17 (primary build JDK)
        id: jdk17
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.os.distro }}
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Set up JDK 21
        id: jdk21
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.os.distro }}
          java-version: '21'
          overwrite-settings: false

      - name: Set up JDK 25
        id: jdk25
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.os.distro }}
          java-version: '25'
          overwrite-settings: false

      - uses: ./.github/actions/maven-wrapper

      - name: Set up MSVC
        if: matrix.os.msvc
        uses: ./.github/actions/msvc
        with:
          arch: ${{ matrix.os.arch }}

      - uses: ./.github/actions/linux-prereqs
        if: runner.os == 'Linux'

      - uses: ./.github/actions/almalinux-sysroot
        if: matrix.os.sysroot
        with:
          arch: ${{ matrix.os.arch }}

      - name: Prepare CEF archive
        uses: ./.github/actions/cef-archives
        with:
          version: ${{ matrix.cef.version }}
          platform: ${{ matrix.os.cef-platform }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # XXX Per-JDK rebuild; JDK 17 also forks the JDK 11 runtime smoke.
      - name: JDK 17 (incl. JDK 11 runtime smoke)
        shell: bash
        env:
          JAVA_HOME: ${{ steps.jdk17.outputs.path }}
          JDK_VERSION: '17'
          JAVA11_SMOKE: true
        run: .github/ci/build.sh

      - name: JDK 21
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JAVA_HOME: ${{ steps.jdk21.outputs.path }}
          JDK_VERSION: '21'
        run: .github/ci/build.sh

      - name: JDK 25
        if: ${{ !cancelled() }}
        shell: bash
        env:
          JAVA_HOME: ${{ steps.jdk25.outputs.path }}
          JDK_VERSION: '25'
        run: .github/ci/build.sh

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.os.label }}-cef${{ matrix.cef.api }}
          path: |
            **/target/surefire-reports/**
            **/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

  consumer:
    name: Consumer examples
    needs: maven-wrapper
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CEF4J_CEF_CACHE: ${{ github.workspace }}/.cef-dist

    steps:
      - uses: actions/checkout@v7

      - *setup-java

      - uses: ./.github/actions/maven-wrapper

      # XXX Versions come from the poms so the consumer never targets a stale snapshot.
      - name: Resolve project versions
        shell: bash
        run: |
          echo "CEF4J_VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout -DskipTests)" >> "${GITHUB_ENV}"
          echo "PACKAGER_VERSION=$(./mvnw -q -f cef4j-runtime-packager/pom.xml help:evaluate -Dexpression=project.version -DforceStdout -DskipTests)" >> "${GITHUB_ENV}"
          echo "CONSUMER_CEF_VERSION=$(./mvnw -q help:evaluate -Dexpression=cef.version -DforceStdout -DskipTests)" >> "${GITHUB_ENV}"

      # XXX cef-archives restores all three desktop dists codegen needs and the real linux64 archive.
      - name: Prepare CEF archive
        uses: ./.github/actions/cef-archives
        with:
          version: ${{ env.CONSUMER_CEF_VERSION }}
          platform: linux64
          save-cache: false

      - name: Build and install reactor
        run: ./mvnw -B install -DskipTests -Dcef.version=${CONSUMER_CEF_VERSION}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Install runtime packager
        run: ./mvnw -B -f cef4j-runtime-packager/pom.xml clean install

      - name: Test Maven consumer
        run: >-
          ./mvnw -B -f examples/maven/pom.xml clean verify
          "-Dcef4j.version=${CEF4J_VERSION}"
          -Dcef4j.platform.artifact=cef4j-platform
          -Dcef4j.platform.classifier=linux-x86_64
          "-Dcef4j.packager.version=${PACKAGER_VERSION}"

      - name: Test Gradle Groovy consumer
        run: >-
          gradle --no-daemon -p examples/gradle-groovy clean build run
          "-Pcef4jVersion=${CEF4J_VERSION}"
          -Pcef4jPlatformArtifact=cef4j-platform
          -Pcef4jPlatformClassifier=linux-x86_64
          "-Pcef4jPackagerVersion=${PACKAGER_VERSION}"

      - name: Test Gradle Kotlin consumer
        run: >-
          gradle --no-daemon -p examples/gradle-kotlin clean build run
          "-Pcef4jVersion=${CEF4J_VERSION}"
          -Pcef4jPlatformArtifact=cef4j-platform
          -Pcef4jPlatformClassifier=linux-x86_64
          "-Pcef4jPackagerVersion=${PACKAGER_VERSION}"

      - name: Test sbt consumer
        working-directory: examples/sbt
        run: >-
          sbt -batch
          "-Dcef4j.version=${CEF4J_VERSION}"
          -Dcef4j.platform.artifact=cef4j-platform
          -Dcef4j.platform.classifier=linux-x86_64
          "-Dcef4j.packager.version=${PACKAGER_VERSION}"
          -Dsbt.supershell=false -Dsbt.log.noformat=true -J-Xmx2G
          clean run package

      - name: Verify packaged consumer runtimes
        run: |
          artifacts=(
            examples/maven/target/cef4j-maven-consumer-1.0.0-SNAPSHOT.jar
            examples/gradle-groovy/build/libs/cef4j-gradle-groovy-consumer.jar
            examples/gradle-kotlin/build/libs/cef4j-gradle-kotlin-consumer.jar
            examples/sbt/target/scala-*/cef4j-sbt-consumer_3-1.0.0-SNAPSHOT.jar
          )
          for artifact in "${artifacts[@]}"; do
            test -f "${artifact}"
            jar tf "${artifact}" | grep -q '^cef-runtime/linux64/file-list.txt$'
            jar tf "${artifact}" | grep -q '^cef-runtime/linux64/cef-runtime.properties$'
            jar tf "${artifact}" | grep -q '^cef-runtime/linux64/libcef.so$'
          done
