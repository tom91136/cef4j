name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Frontier and pooled legacy tracks cover every native target and supported build JDK.
jobs:
  packager:
    name: Runtime packager / ${{ matrix.os }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026, macos-26]
        java: ['11', '17', '21', '25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: cef4j-runtime-packager/pom.xml
      - name: Test the Java 11 runtime packager
        run: ./mvnw -B -f cef4j-runtime-packager/pom.xml clean verify

      - name: Verify packager release artifacts
        if: matrix.os == 'ubuntu-24.04' && matrix.java == '11'
        run: ./mvnw -B -f cef4j-runtime-packager/pom.xml clean verify -Pruntime-packager-release -Dgpg.skip=true

  maven-wrapper:
    name: Bootstrap Maven wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
      - id: wrapper-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
          enableCrossOsArchive: true
      - name: Download Maven wrapper distribution once
        if: steps.wrapper-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: ./mvnw --version
      - name: Save Maven wrapper distribution
        if: steps.wrapper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/wrapper
          key: ${{ steps.wrapper-cache.outputs.cache-primary-key }}
          enableCrossOsArchive: true

  linux:
    needs: maven-wrapper
    name: Linux ${{ matrix.platform.arch }} / ${{ matrix.track }} / JDK ${{ matrix.jdk.java }} / JavaFX ${{ matrix.jdk.javafx }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 330
    env:
      CONSUMER_CEF_VERSION: &cef150-version 150.0.18+gdb11278+chromium-150.0.7871.213
      CONSUMER_PACKAGER_VERSION: 0.1.0-SNAPSHOT
      CONSUMER_CEF4J_VERSION: 150.0.0-SNAPSHOT
      CMAKE_SYSROOT: ${{ github.workspace }}/sysroot/out/${{ matrix.platform.arch }}
      # Linux ARM64 OpenJFX starts at 21 and has no JDK 17-compatible artifact.
      JAVAFX_VERSION: &linux-javafx-version ${{ matrix.platform.arch == 'aarch64' && matrix.jdk.java == '21' && '21.0.1' || matrix.jdk.javafx }}
      JAVAFX_TEST_VERSION: *linux-javafx-version
      JAVAFX_TESTS: ${{ matrix.platform.arch != 'aarch64' || matrix.jdk.java != '17' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: x86_64, os: ubuntu-24.04, cef-platform: linux64 }
          - { arch: aarch64, os: ubuntu-24.04-arm, cef-platform: linuxarm64 }
        jdk:
          - { java: '17', javafx: '13.0.2' }
          - { java: '21', javafx: '21.0.12' }
          - { java: '25', javafx: '25.0.4' }
        track: [frontier, legacy]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: |
            11
            ${{ matrix.jdk.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Set up Gradle for consumer examples
        if: matrix.track == 'frontier' && matrix.platform.arch == 'x86_64' && matrix.jdk.java == '17'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Set up sbt for consumer examples
        if: matrix.track == 'frontier' && matrix.platform.arch == 'x86_64' && matrix.jdk.java == '17'
        uses: sbt/setup-sbt@v1

      - name: Cache Maven wrapper distribution
        uses: actions/cache@v6
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
          enableCrossOsArchive: true

      # dependency:go-offline cannot discover Surefire's lazily selected provider.
      - name: Prewarm Surefire JUnit provider
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: >-
            ./mvnw -B dependency:get
            "-Dartifact=org.apache.maven.surefire:surefire-junit-platform:3.5.6"

      - id: sysroot-cache
        name: Restore AlmaLinux 8 sysroot
        uses: actions/cache/restore@v6
        with:
          path: sysroot/out/sysroot-al8-${{ matrix.platform.arch }}.tar.xz
          key: sysroot-al8-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform.arch }}-${{ hashFiles('sysroot/Dockerfile', 'sysroot/manage.sh') }}

      - name: Build AlmaLinux 8 sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        run: sysroot/manage.sh build ${{ matrix.platform.arch }}

      - name: Save AlmaLinux 8 sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: sysroot/out/sysroot-al8-${{ matrix.platform.arch }}.tar.xz
          key: ${{ steps.sysroot-cache.outputs.cache-primary-key }}

      - name: Prepare AlmaLinux 8 sysroot
        run: sysroot/manage.sh prepare ${{ matrix.platform.arch }}

      - name: Install Linux build and runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake make binutils xvfb \
            libgtk-3-0 libxss1 libnss3 libasound2t64 libcups2 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libpango-1.0-0 libatk-bridge2.0-0 libdrm2 libgbm1

      # Immutable archives share one cache entry across target and codegen use.
      - id: cef109-archive
        name: Prepare CEF 109 archives
        if: matrix.track == 'legacy'
        uses: ./.github/actions/cef-archives
        with:
          version: &cef109-version 109.1.18+gf1c41e4+chromium-109.0.5414.120
          platform: &linux-cef-platform ${{ matrix.platform.cef-platform }}
          save-cache: &save-cef-cache ${{ github.ref == 'refs/heads/main' }}

      - id: cef116-archive
        name: Prepare CEF 116 archives
        if: ${{ !cancelled() && matrix.track == 'legacy' }}
        uses: ./.github/actions/cef-archives
        with:
          version: &cef116-version 116.0.27+gd8c85ac+chromium-116.0.5845.190
          platform: *linux-cef-platform
          save-cache: *save-cef-cache

      - id: cef138-archive
        name: Prepare CEF 138 archives
        if: ${{ !cancelled() && matrix.track == 'legacy' }}
        uses: ./.github/actions/cef-archives
        with:
          version: &cef138-version 138.0.62+g6981a09+chromium-138.0.7204.310
          platform: *linux-cef-platform
          save-cache: *save-cef-cache

      - id: cef144-archive
        name: Prepare CEF 144 archives
        if: ${{ !cancelled() && matrix.track == 'legacy' }}
        uses: ./.github/actions/cef-archives
        with:
          version: &cef144-version 144.0.19+g937f5c6+chromium-144.0.7559.246
          platform: *linux-cef-platform
          save-cache: *save-cef-cache

      - id: cef150-archive
        name: Prepare CEF 150 archives
        if: ${{ !cancelled() && matrix.track == 'frontier' }}
        uses: ./.github/actions/cef-archives
        with:
          version: *cef150-version
          platform: *linux-cef-platform
          save-cache: *save-cef-cache

      # Keep every legacy CEF release as a distinct step while reusing this
      # platform/JDK runner. A failed lane does not prevent later lanes running.
      - id: cef109
        name: Legacy CEF 109
        if: ${{ !cancelled() && matrix.track == 'legacy' && steps.cef109-archive.outcome == 'success' }}
        env:
          CEF_VERSION: *cef109-version
          CEF_API: &cef109-api '109'
        run: &linux-build .github/ci/build.sh linux

      - id: cef116
        name: Legacy CEF 116
        if: ${{ !cancelled() && matrix.track == 'legacy' && steps.cef116-archive.outcome == 'success' }}
        env:
          CEF_VERSION: *cef116-version
          CEF_API: &cef116-api '116'
        run: *linux-build

      - id: cef138
        name: Legacy LTS CEF 138
        if: ${{ !cancelled() && matrix.track == 'legacy' && steps.cef138-archive.outcome == 'success' }}
        env:
          CEF_VERSION: *cef138-version
          CEF_API: &cef138-api '138'
        run: *linux-build

      - id: cef144
        name: Legacy LTS CEF 144
        if: ${{ !cancelled() && matrix.track == 'legacy' && steps.cef144-archive.outcome == 'success' }}
        env:
          CEF_VERSION: *cef144-version
          CEF_API: &cef144-api '144'
        run: *linux-build

      - id: cef150
        name: Frontier CEF 150
        if: ${{ !cancelled() && matrix.track == 'frontier' && steps.cef150-archive.outcome == 'success' }}
        env:
          CEF_VERSION: *cef150-version
          CEF_API: &cef150-api '150'
          JAVA11_SMOKE: ${{ matrix.jdk.java == '17' }}
        run: *linux-build

      - id: consumer-fixture
        name: Prepare synthetic CEF consumer fixture
        if: ${{ !cancelled() && matrix.track == 'frontier' && matrix.platform.arch == 'x86_64' && matrix.jdk.java == '17' && steps.cef150.outcome == 'success' }}
        run: |
          fixture=$(mktemp -d "${RUNNER_TEMP}/cef4j-consumer-fixture.XXXXXX")
          distribution="${fixture}/cef_binary_${CONSUMER_CEF_VERSION}_linux64_minimal"
          cache="${fixture}/cache"
          archive="${cache}/cef_binary_${CONSUMER_CEF_VERSION}_linux64_minimal.tar.bz2"
          mkdir -p "${distribution}/Release" "${distribution}/Resources/locales" "${cache}"
          printf 'fixture libcef\n' > "${distribution}/Release/libcef.so"
          printf 'fixture v8\n' > "${distribution}/Release/v8_context_snapshot.bin"
          printf 'fixture icu\n' > "${distribution}/Resources/icudtl.dat"
          printf 'fixture resources\n' > "${distribution}/Resources/resources.pak"
          printf 'fixture locale\n' > "${distribution}/Resources/locales/en-US.pak"
          printf 'CEF fixture licence\n' > "${distribution}/LICENSE.txt"
          tar -cjf "${archive}" -C "${fixture}" "${distribution##*/}"
          sha1sum "${archive}" | awk '{print $1}' > "${archive}.sha1"
          echo "CEF4J_CEF_CACHE=${cache}" >> "${GITHUB_ENV}"

      - id: consumer-packager
        name: Install runtime packager for consumer examples
        if: ${{ !cancelled() && steps.consumer-fixture.outcome == 'success' }}
        run: ./mvnw -B -f cef4j-runtime-packager/pom.xml clean install

      - id: consumer-maven
        name: Test Maven consumer
        if: ${{ !cancelled() && steps.consumer-packager.outcome == 'success' }}
        run: >-
          ./mvnw -B -f examples/maven/pom.xml clean verify
          "-Dcef4j.version=${CONSUMER_CEF4J_VERSION}"
          -Dcef4j.platform.artifact=cef4j-platform
          -Dcef4j.platform.classifier=linux-x86_64
          "-Dcef4j.packager.version=${CONSUMER_PACKAGER_VERSION}"

      - id: consumer-gradle-groovy
        name: Test Gradle Groovy consumer
        if: ${{ !cancelled() && steps.consumer-packager.outcome == 'success' }}
        run: >-
          gradle --no-daemon -p examples/gradle-groovy clean build run
          "-Pcef4jVersion=${CONSUMER_CEF4J_VERSION}"
          -Pcef4jPlatformArtifact=cef4j-platform
          -Pcef4jPlatformClassifier=linux-x86_64
          "-Pcef4jPackagerVersion=${CONSUMER_PACKAGER_VERSION}"

      - id: consumer-gradle-kotlin
        name: Test Gradle Kotlin consumer
        if: ${{ !cancelled() && steps.consumer-packager.outcome == 'success' }}
        run: >-
          gradle --no-daemon -p examples/gradle-kotlin clean build run
          "-Pcef4jVersion=${CONSUMER_CEF4J_VERSION}"
          -Pcef4jPlatformArtifact=cef4j-platform
          -Pcef4jPlatformClassifier=linux-x86_64
          "-Pcef4jPackagerVersion=${CONSUMER_PACKAGER_VERSION}"

      - id: consumer-sbt
        name: Test sbt consumer
        if: ${{ !cancelled() && steps.consumer-packager.outcome == 'success' }}
        working-directory: examples/sbt
        run: >-
          sbt -batch
          "-Dcef4j.version=${CONSUMER_CEF4J_VERSION}"
          -Dcef4j.platform.artifact=cef4j-platform
          -Dcef4j.platform.classifier=linux-x86_64
          "-Dcef4j.packager.version=${CONSUMER_PACKAGER_VERSION}"
          -Dsbt.supershell=false -Dsbt.log.noformat=true -J-Xmx2G
          clean run package

      - name: Verify packaged consumer runtimes
        if: ${{ !cancelled() && steps.consumer-maven.outcome == 'success' && steps.consumer-gradle-groovy.outcome == 'success' && steps.consumer-gradle-kotlin.outcome == 'success' && steps.consumer-sbt.outcome == 'success' }}
        run: |
          artifacts=(
            examples/maven/target/cef4j-maven-consumer-1.0.0-SNAPSHOT.jar
            examples/gradle-groovy/build/libs/cef4j-gradle-groovy-consumer.jar
            examples/gradle-kotlin/build/libs/cef4j-gradle-kotlin-consumer.jar
            examples/sbt/target/scala-*/cef4j-sbt-consumer_3-1.0.0-SNAPSHOT.jar
          )
          for artifact in "${artifacts[@]}"; do
            test -f "${artifact}"
            jar tf "${artifact}" | grep -q '^cef-runtime/linux64/file-list.txt$'
            jar tf "${artifact}" | grep -q '^cef-runtime/linux64/cef-runtime.properties$'
            jar tf "${artifact}" | grep -q '^cef-runtime/linux64/libcef.so$'
          done

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-linux-${{ matrix.platform.arch }}-${{ matrix.track }}-jdk${{ matrix.jdk.java }}-jfx${{ matrix.jdk.javafx }}
          path: |
            ci-reports/**
            **/target/surefire-reports/**
            **/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    needs: maven-wrapper
    name: ${{ matrix.platform.label }} / ${{ matrix.track }} / JDK ${{ matrix.jdk.java }} / JavaFX ${{ matrix.jdk.javafx }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 330
    env:
      JAVAFX_VERSION: &desktop-javafx-version ${{ runner.os == 'macOS' && matrix.platform.arch == 'aarch64' && matrix.jdk.java == '17' && '17.0.15' || matrix.jdk.javafx }}
      JAVAFX_TEST_VERSION: *desktop-javafx-version
      JAVAFX_TESTS: ${{ matrix.platform.javafx-tests }}
      JAVAFX_PLATFORM: ${{ runner.os == 'Windows' && matrix.platform.arch == 'aarch64' && 'win' || '' }}
      CEF4J_TEST_EXTRA_ARGS: ${{ runner.os == 'macOS' && '--disable-gpu,--use-mock-keychain' || '--disable-gpu' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { label: 'Windows x64', os: 'windows-2025-vs2026', arch: x86_64, cef-platform: windows64, distribution: corretto, javafx-tests: true }
          # The Microsoft ARM64 JDK turns Chromium's NTE_BAD_KEYSET exception into a fatal VM
          # error on hosted Windows ARM. Zulu is a native Windows ARM64 JDK at every build level.
          - { label: 'Windows ARM', os: 'windows-11-arm', arch: aarch64, cef-platform: windowsarm64, distribution: zulu, javafx-tests: false }
          - { label: 'macOS Intel', os: 'macos-26-intel', arch: x86_64, cef-platform: macosx64, distribution: corretto, javafx-tests: true }
          - { label: 'macOS ARM', os: 'macos-26', arch: aarch64, cef-platform: macosarm64, distribution: corretto, javafx-tests: true }
        jdk:
          - { java: '17', javafx: '13.0.2' }
          - { java: '21', javafx: '21.0.12' }
          - { java: '25', javafx: '25.0.4' }
        track: [frontier, legacy]
    steps:
      - uses: actions/checkout@v7

      # Windows ARM uses Microsoft 11 for the smoke toolchain and Zulu for the build JDK.
      - name: Set up Java 11 runtime toolchain
        uses: actions/setup-java@v5
        with:
          distribution: ${{ runner.os == 'Windows' && matrix.platform.arch == 'aarch64' && 'microsoft' || matrix.platform.distribution }}
          java-version: '11'

      - name: Set up build JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.platform.distribution }}
          java-version: ${{ matrix.jdk.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Cache Maven wrapper distribution
        uses: actions/cache@v6
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
          enableCrossOsArchive: true

      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -property installationPath
          if (-not $install) { throw "Visual Studio with C++ tools was not found" }
          $arch = "${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}"
          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvarsall.bat"
          $environment = cmd /d /s /c "`"$vcvars`" $arch >nul && set"
          $names = @('INCLUDE', 'LIB', 'LIBPATH', 'PATH', 'UCRTVersion', 'UniversalCRTSdkDir',
                     'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsRedistDir', 'VSCMD_ARG_HOST_ARCH',
                     'VSCMD_ARG_TGT_ARCH', 'WindowsLibPath', 'WindowsSdkBinPath', 'WindowsSdkDir',
                     'WindowsSDKVersion')
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$' -and $names -contains $Matches[1]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      # Surefire discovers this provider lazily only when tests begin. Resolve it
      # once before the pooled CEF lanes so network retries never repeat a test.
      - name: Prewarm Surefire JUnit provider
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: >-
            ./mvnw -B dependency:get
            "-Dartifact=org.apache.maven.surefire:surefire-junit-platform:3.5.6"

      - id: cef109-archive
        name: Prepare CEF 109 archives
        if: matrix.track == 'legacy'
        uses: ./.github/actions/cef-archives
        with:
          version: *cef109-version
          platform: &desktop-cef-platform ${{ matrix.platform.cef-platform }}
          save-cache: *save-cef-cache

      - id: cef116-archive
        name: Prepare CEF 116 archives
        if: ${{ !cancelled() && matrix.track == 'legacy' }}
        uses: ./.github/actions/cef-archives
        with:
          version: *cef116-version
          platform: *desktop-cef-platform
          save-cache: *save-cef-cache

      - id: cef138-archive
        name: Prepare CEF 138 archives
        if: ${{ !cancelled() && matrix.track == 'legacy' }}
        uses: ./.github/actions/cef-archives
        with:
          version: *cef138-version
          platform: *desktop-cef-platform
          save-cache: *save-cef-cache

      - id: cef144-archive
        name: Prepare CEF 144 archives
        if: ${{ !cancelled() && matrix.track == 'legacy' }}
        uses: ./.github/actions/cef-archives
        with:
          version: *cef144-version
          platform: *desktop-cef-platform
          save-cache: *save-cef-cache

      - id: cef150-archive
        name: Prepare CEF 150 archives
        if: ${{ !cancelled() && matrix.track == 'frontier' }}
        uses: ./.github/actions/cef-archives
        with:
          version: *cef150-version
          platform: *desktop-cef-platform
          save-cache: *save-cef-cache

      # Mock the macOS keychain to avoid unsigned Chromium Safe Storage prompts.
      - id: cef109
        name: Legacy CEF 109
        if: ${{ !cancelled() && matrix.track == 'legacy' && steps.cef109-archive.outcome == 'success' }}
        shell: bash
        env:
          CEF_VERSION: *cef109-version
          CEF_API: *cef109-api
        run: &desktop-build .github/ci/build.sh desktop

      - id: cef116
        name: Legacy CEF 116
        if: ${{ !cancelled() && matrix.track == 'legacy' && steps.cef116-archive.outcome == 'success' }}
        shell: bash
        env:
          CEF_VERSION: *cef116-version
          CEF_API: *cef116-api
        run: *desktop-build

      - id: cef138
        name: Legacy LTS CEF 138
        if: ${{ !cancelled() && matrix.track == 'legacy' && steps.cef138-archive.outcome == 'success' }}
        shell: bash
        env:
          CEF_VERSION: *cef138-version
          CEF_API: *cef138-api
        run: *desktop-build

      - id: cef144
        name: Legacy LTS CEF 144
        if: ${{ !cancelled() && matrix.track == 'legacy' && steps.cef144-archive.outcome == 'success' }}
        shell: bash
        env:
          CEF_VERSION: *cef144-version
          CEF_API: *cef144-api
        run: *desktop-build

      - id: cef150
        name: Frontier CEF 150
        if: ${{ !cancelled() && matrix.track == 'frontier' && steps.cef150-archive.outcome == 'success' }}
        shell: bash
        env:
          CEF_VERSION: *cef150-version
          CEF_API: *cef150-api
          JAVA11_SMOKE: ${{ matrix.jdk.java == '17' }}
        run: *desktop-build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.platform.os }}-${{ matrix.track }}-jdk${{ matrix.jdk.java }}-jfx${{ matrix.jdk.javafx }}
          path: |
            ci-reports/**
            **/target/surefire-reports/**
            **/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7
