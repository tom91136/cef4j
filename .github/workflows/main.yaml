name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Exercise every supported native target and CEF API with every supported LTS
# build JDK. JavaFX follows the JDK axis, while a focused second pass verifies
# that all non-JavaFX modules build and test without the JavaFX reactor modules.
# Java 11 remains the runtime/bytecode floor; Maven and Scala code generation
# intentionally run on 17+.
jobs:
  maven-wrapper:
    name: Bootstrap Maven wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '17'
      - id: wrapper-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
          enableCrossOsArchive: true
      - name: Download Maven wrapper distribution once
        if: steps.wrapper-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 3
          max_attempts: 3
          command: ./mvnw --version
      - name: Save Maven wrapper distribution
        if: steps.wrapper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.m2/wrapper
          key: ${{ steps.wrapper-cache.outputs.cache-primary-key }}
          enableCrossOsArchive: true

  linux:
    needs: maven-wrapper
    name: Linux ${{ matrix.platform.arch }} / JDK ${{ matrix.jdk.java }} / CEF ${{ matrix.cef.api }} / JavaFX ${{ matrix.jdk.javafx }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: x86_64, os: ubuntu-24.04, cef-platform: linux64 }
          - { arch: aarch64, os: ubuntu-24.04-arm, cef-platform: linuxarm64 }
        cef:
          - { api: '109', version: '109.1.18+gf1c41e4+chromium-109.0.5414.120' }
          - { api: '116', version: '116.0.27+gd8c85ac+chromium-116.0.5845.190' }
          - { api: '144', version: '144.0.19+g937f5c6+chromium-144.0.7559.246' }
          - { api: '146', version: '146.0.9+g3ca6a87+chromium-146.0.7680.165' }
        jdk:
          - { java: '17', javafx: '13.0.2' }
          - { java: '21', javafx: '21.0.7' }
          - { java: '25', javafx: '25.0.2' }
    steps:
      - uses: actions/checkout@v6

      # The complete 4-version/6-platform archive set is about 4.9 GiB. Each
      # immutable archive has one cache entry, shared by target and codegen use.
      - name: Prepare compressed CEF archives
        uses: ./.github/actions/cef-archives
        with:
          version: ${{ matrix.cef.version }}
          platform: ${{ matrix.platform.cef-platform }}
          # PR caches remain read-only so they cannot evict main's entries.
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: |
            11
            ${{ matrix.jdk.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Cache Maven wrapper distribution
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
          enableCrossOsArchive: true

      # Surefire detects its JUnit provider only when tests begin, so dependency:go-offline cannot discover it.
      # Resolve that lazy provider explicitly while CDN/DNS failures are still covered by retries.
      - name: Prewarm Surefire JUnit provider
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: >-
            ./mvnw -B dependency:get
            "-Dartifact=org.apache.maven.surefire:surefire-junit-platform:3.5.6"

      - id: sysroot-cache
        name: Restore AlmaLinux 8 sysroot
        uses: actions/cache/restore@v5
        with:
          path: sysroot/out/sysroot-al8-${{ matrix.platform.arch }}.tar.xz
          key: sysroot-al8-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform.arch }}-${{ hashFiles('sysroot/Dockerfile', 'sysroot/manage.sh') }}

      - name: Build AlmaLinux 8 sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        run: sysroot/manage.sh build ${{ matrix.platform.arch }}

      - name: Save AlmaLinux 8 sysroot
        if: steps.sysroot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: sysroot/out/sysroot-al8-${{ matrix.platform.arch }}.tar.xz
          key: ${{ steps.sysroot-cache.outputs.cache-primary-key }}

      - name: Prepare AlmaLinux 8 sysroot
        run: sysroot/manage.sh prepare ${{ matrix.platform.arch }}

      - name: Install Linux build and runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake make binutils xvfb \
            libgtk-3-0 libxss1 libnss3 libasound2t64 libcups2 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libpango-1.0-0 libatk-bridge2.0-0 libdrm2 libgbm1

      # dependency:go-offline cannot see Spotless' lazily provisioned Eclipse CDT
      # P2 payload. Resolve it separately with retries; the actual build and tests
      # below still execute exactly once.
      - name: Prewarm Spotless C++ formatter
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: >-
            ./mvnw -B -pl cef4j-native spotless:check
            "-Dcef.version=${{ matrix.cef.version }}"
            "-Dcef.api.version=${{ matrix.cef.api }}"

      - name: Build and test against AlmaLinux 8 sysroot
        env:
          CMAKE_SYSROOT: ${{ github.workspace }}/sysroot/out/${{ matrix.platform.arch }}
          CEF_VERSION: ${{ matrix.cef.version }}
          CEF_API: ${{ matrix.cef.api }}
          JAVAFX_VERSION: ${{ matrix.platform.arch == 'aarch64' && matrix.jdk.java == '21' && '21.0.1' || matrix.jdk.javafx }}
          # JavaFX only published a Linux ARM64 build for the initial 21 release,
          # and has no ARM64 artifact compatible with JDK 17.
          JAVAFX_TEST_VERSION: ${{ matrix.platform.arch == 'aarch64' && matrix.jdk.java == '21' && '21.0.1' || matrix.jdk.javafx }}
          JAVAFX_TESTS: ${{ matrix.platform.arch != 'aarch64' || matrix.jdk.java != '17' }}
          JAVA11_SMOKE: ${{ matrix.cef.api == '146' && matrix.jdk.java == '17' }}
        run: .github/ci/linux-build.sh

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-linux-${{ matrix.platform.arch }}-jdk${{ matrix.jdk.java }}-cef${{ matrix.cef.api }}-jfx${{ matrix.jdk.javafx }}
          path: |
            **/target/surefire-reports/**
            **/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    needs: maven-wrapper
    name: ${{ matrix.platform.label }} / JDK ${{ matrix.jdk.java }} / CEF ${{ matrix.cef.api }} / JavaFX ${{ matrix.jdk.javafx }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { label: 'Windows x64', os: 'windows-2025-vs2026', arch: x86_64, cef-platform: windows64, distribution: corretto, javafx-tests: true }
          # The Microsoft ARM64 JDK turns Chromium's NTE_BAD_KEYSET exception into a fatal VM
          # error on hosted Windows ARM. Zulu is a native Windows ARM64 JDK at every build level.
          - { label: 'Windows ARM', os: 'windows-11-arm', arch: aarch64, cef-platform: windowsarm64, distribution: zulu, javafx-tests: false }
          - { label: 'macOS Intel', os: 'macos-26-intel', arch: x86_64, cef-platform: macosx64, distribution: corretto, javafx-tests: true }
          - { label: 'macOS ARM', os: 'macos-26', arch: aarch64, cef-platform: macosarm64, distribution: corretto, javafx-tests: true }
        cef:
          - { api: '109', version: '109.1.18+gf1c41e4+chromium-109.0.5414.120' }
          - { api: '116', version: '116.0.27+gd8c85ac+chromium-116.0.5845.190' }
          - { api: '144', version: '144.0.19+g937f5c6+chromium-144.0.7559.246' }
          - { api: '146', version: '146.0.9+g3ca6a87+chromium-146.0.7680.165' }
        jdk:
          - { java: '17', javafx: '13.0.2' }
          - { java: '21', javafx: '21.0.7' }
          - { java: '25', javafx: '25.0.2' }
    steps:
      - uses: actions/checkout@v6

      # setup-java records each installation in Maven's toolchains.xml. Windows
      # ARM needs Microsoft for the Java 11 smoke toolchain because Zulu's native
      # Windows ARM64 builds start after 11; the active Java 21 build JDK remains
      # Zulu to avoid Microsoft 21's fatal handling of Chromium NTE_BAD_KEYSET.
      - name: Set up Java 11 runtime toolchain
        uses: actions/setup-java@v5
        with:
          distribution: ${{ runner.os == 'Windows' && matrix.platform.arch == 'aarch64' && 'microsoft' || matrix.platform.distribution }}
          java-version: '11'

      - name: Set up build JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.platform.distribution }}
          java-version: ${{ matrix.jdk.java }}
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Cache Maven wrapper distribution
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
          enableCrossOsArchive: true

      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -property installationPath
          if (-not $install) { throw "Visual Studio with C++ tools was not found" }
          $arch = "${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}"
          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvarsall.bat"
          $environment = cmd /d /s /c "`"$vcvars`" $arch >nul && set"
          $names = @('INCLUDE', 'LIB', 'LIBPATH', 'PATH', 'UCRTVersion', 'UniversalCRTSdkDir',
                     'VCINSTALLDIR', 'VCToolsInstallDir', 'VCToolsRedistDir', 'VSCMD_ARG_HOST_ARCH',
                     'VSCMD_ARG_TGT_ARCH', 'WindowsLibPath', 'WindowsSdkBinPath', 'WindowsSdkDir',
                     'WindowsSDKVersion')
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$' -and $names -contains $Matches[1]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Prepare compressed CEF archives
        uses: ./.github/actions/cef-archives
        with:
          version: ${{ matrix.cef.version }}
          platform: ${{ matrix.platform.cef-platform }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Resolve dependencies
        if: runner.os != 'Windows' || matrix.platform.arch != 'aarch64'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: >-
            ./mvnw -B dependency:go-offline
            "-DexcludeArtifactIds=cef4j-platform,cef4j-runtime-server"
            "-Dcef.version=${{ matrix.cef.version }}"
            "-Dcef.api.version=${{ matrix.cef.api }}"
            "-Djavafx.version=${{ runner.os == 'macOS' && matrix.platform.arch == 'aarch64' && matrix.jdk.java == '17' && '17.0.15' || matrix.jdk.javafx }}"
            "-Djavafx.test.version=${{ runner.os == 'macOS' && matrix.platform.arch == 'aarch64' && matrix.jdk.java == '17' && '17.0.15' || matrix.jdk.javafx }}"

      - name: Resolve dependencies for Windows ARM
        if: runner.os == 'Windows' && matrix.platform.arch == 'aarch64'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: >-
            ./mvnw -B dependency:go-offline
            "-DexcludeArtifactIds=cef4j-platform,cef4j-runtime-server"
            "-Dcef.version=${{ matrix.cef.version }}"
            "-Dcef.api.version=${{ matrix.cef.api }}"
            "-Djavafx.version=${{ matrix.jdk.javafx }}"
            "-Djavafx.test.version=${{ matrix.jdk.javafx }}"
            "-Djavafx.platform=win"

      # Surefire detects its JUnit provider only when tests begin, so dependency:go-offline cannot discover it.
      # Resolve that lazy provider explicitly while CDN/DNS failures are still covered by retries.
      - name: Prewarm Surefire JUnit provider
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: >-
            ./mvnw -B dependency:get
            "-Dartifact=org.apache.maven.surefire:surefire-junit-platform:3.5.6"

      # Spotless provisions Eclipse CDT from its P2 repository only when the C++
      # formatter first runs, so dependency:go-offline does not protect this CDN
      # access. Retrying this read-only format check does not retry any test.
      - name: Prewarm Spotless C++ formatter
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: >-
            ./mvnw -B -pl cef4j-native spotless:check
            "-Dcef.version=${{ matrix.cef.version }}"
            "-Dcef.api.version=${{ matrix.cef.api }}"

      # GitHub-hosted Windows and macOS runners are disposable VMs with their own
      # WindowStation/WindowServer session, so GUI tests cannot reach a developer desktop.
      # Mock the macOS keychain because unsigned Chromium test processes can block
      # in Security.framework while authorizing a persisted Safe Storage item.
      - name: Build and test in isolated hosted desktop
        if: matrix.platform.javafx-tests
        run: >-
          ./mvnw -B clean install
          "-Dcef.version=${{ matrix.cef.version }}"
          "-Dcef.api.version=${{ matrix.cef.api }}"
          "-Djavafx.version=${{ runner.os == 'macOS' && matrix.platform.arch == 'aarch64' && matrix.jdk.java == '17' && '17.0.15' || matrix.jdk.javafx }}"
          "-Djavafx.test.version=${{ runner.os == 'macOS' && matrix.platform.arch == 'aarch64' && matrix.jdk.java == '17' && '17.0.15' || matrix.jdk.javafx }}"
          "-Dcef4j.test.extraArgs=${{ runner.os == 'macOS' && '--disable-gpu,--use-mock-keychain' || '--disable-gpu' }}"
          "-Dcef4j.runtime.server.extraArgs=${{ runner.os == 'macOS' && '--disable-gpu,--use-mock-keychain' || '--disable-gpu' }}"

      # OpenJFX currently publishes no Windows ARM64 native artifacts. Compile the
      # complete reactor, then exercise every non-JavaFX module natively on ARM64.
      - name: Build and test on Windows ARM without JavaFX
        if: ${{ !matrix.platform.javafx-tests }}
        shell: bash
        run: |
          ./mvnw -B clean install -DskipTests \
            "-Dcef.version=${{ matrix.cef.version }}" \
            "-Dcef.api.version=${{ matrix.cef.api }}" \
            "-Djavafx.version=${{ matrix.jdk.javafx }}" \
            "-Djavafx.test.version=${{ matrix.jdk.javafx }}" \
            "-Djavafx.platform=win" \
            "-Dcef4j.test.extraArgs=--disable-gpu" \
            "-Dcef4j.runtime.server.extraArgs=--disable-gpu"
          ./mvnw -B test \
            -pl '!cef4j-inprocess-jfx,!cef4j-remote-jfx,!cef4j-integration-tests,!cef4j-sample' \
            "-Dcef.version=${{ matrix.cef.version }}" \
            "-Dcef.api.version=${{ matrix.cef.api }}" \
            "-Djavafx.version=${{ matrix.jdk.javafx }}" \
            "-Djavafx.test.version=${{ matrix.jdk.javafx }}" \
            "-Djavafx.platform=win" \
            "-Dcef4j.test.extraArgs=--disable-gpu" \
            "-Dcef4j.runtime.server.extraArgs=--disable-gpu"

      - name: Test without JavaFX modules
        if: matrix.platform.javafx-tests
        shell: bash
        run: |
          ./mvnw -B test \
            -pl '!cef4j-inprocess-jfx,!cef4j-remote-jfx,!cef4j-integration-tests,!cef4j-sample' \
            "-Dcef.version=${{ matrix.cef.version }}" \
            "-Dcef.api.version=${{ matrix.cef.api }}" \
            "-Djavafx.version=${{ runner.os == 'macOS' && matrix.platform.arch == 'aarch64' && matrix.jdk.java == '17' && '17.0.15' || matrix.jdk.javafx }}" \
            "-Djavafx.test.version=${{ runner.os == 'macOS' && matrix.platform.arch == 'aarch64' && matrix.jdk.java == '17' && '17.0.15' || matrix.jdk.javafx }}" \
            "-Dcef4j.test.extraArgs=${{ runner.os == 'macOS' && '--disable-gpu,--use-mock-keychain' || '--disable-gpu' }}" \
            "-Dcef4j.runtime.server.extraArgs=${{ runner.os == 'macOS' && '--disable-gpu,--use-mock-keychain' || '--disable-gpu' }}"

      - name: Java 11 runtime smoke
        if: matrix.cef.api == '146' && matrix.jdk.java == '17'
        run: >-
          ./mvnw -B
          -pl cef4j-remote-core,cef4j-remote-recording-gson,cef4j-remote-recording-jackson,cef4j-remote-frame,cef4j-cdp,cef4j-cdp-gson,cef4j-cdp-jackson,cef4j-remote-cdp-gson,cef4j-remote-cdp-jackson,cef4j-webdriver,cef4j-webdriver-gson,cef4j-webdriver-jackson,cef4j-remote-webdriver
          test "-Djava11.runtime.smoke=true"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.platform.os }}-cef${{ matrix.cef.api }}-jdk${{ matrix.jdk.java }}-jfx${{ matrix.jdk.javafx }}
          path: |
            **/target/surefire-reports/**
            **/hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7
